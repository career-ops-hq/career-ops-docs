# Anti-regression guard for the agent-facing layer (search-ops V2 audit, #7).
#
# agentic-seo (Osmani) assumes a static docs site and can't score a Next.js SSR
# build (AGENTS.md / llms.txt / docs .md are all routes, not files), so the GATE
# is a bespoke check (scripts/verify-agent-layer.mjs) that asserts the exact
# invariants each agent-layer PR verifies by hand: the .md rewrite, Accept
# negotiation, browser-HTML intact, /AGENTS.md pointer, one EN llms.txt Docs
# index with absolute .md links, no escaped entities, no leaked JSX, no relative
# links, and the mirror left crawlable. agentic-seo runs afterwards as a
# non-blocking informational score for the Discovery checks it does evaluate.
#
# WHY THE SCOPE TEST LIVES IN THE JOB AND NOT IN `on.paths` (4 Sep 2026).
# `guard` is a required status check on main. A required check that is filtered
# out by `on.paths` never reports at all, and GitHub reads "never reported" as
# "not yet satisfied" rather than "not applicable" — so every pull request that
# touched only public/, the README, package.json or .github/ was unmergeable
# forever, with no failing check to point at. Refreshing a PDF in public/ hit
# exactly that and could only be landed with --admin, which is the one thing a
# branch protection exists to stop being routine.
#
# So the workflow now runs on every pull request and decides scope inside the
# job. Out of scope means the expensive steps are skipped and the check reports
# green, which is a real verdict of "these invariants cannot have moved". The
# scope list started as the former `on.paths` list: every agent-layer surface
# is a route under src/app/, so nothing in public/ can regress it. Since 1 Oct
# 2026 it also covers the dependency and root config files (package*.json,
# source.config.ts, proxy.ts, tsconfig, postcss): a Next.js or Fumadocs bump can
# break hreflang, headers and rewrites all at once without touching src/.
name: Agent-layer guard

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  guard:
    runs-on: ubuntu-latest
    # deployments: read lets the i18n guard ask which commit production runs
    # (see "Is production an ancestor of this build?").
    permissions:
      contents: read
      deployments: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Does this change touch the agent layer?
        id: scope
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="origin/${{ github.base_ref }}...HEAD"
          else
            case "${{ github.event.before }}" in
              ''|0000000000000000000000000000000000000000) RANGE="" ;;
              *) RANGE="${{ github.event.before }}..HEAD" ;;
            esac
          fi

          # No trustworthy range (force push, first commit on a branch): don't
          # guess the scope, run the guard. The fail-safe direction is to work.
          if [ -z "$RANGE" ] || ! git rev-parse "${RANGE%%.*}" >/dev/null 2>&1; then
            echo "range unusable, running the guard"
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED=$(git diff --name-only "$RANGE")
          echo "changed files:"; echo "$CHANGED" | sed 's/^/  /'

          if echo "$CHANGED" | grep -qE '^(src/|content/|next\.config\.mjs$|proxy\.ts$|source\.config\.ts$|package\.json$|package-lock\.json$|tsconfig\.json$|postcss\.config\.mjs$|scripts/verify-agent-layer\.mjs$|scripts/verify-i18n-seo\.mjs$|\.github/workflows/agent-layer-guard\.yml$)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "nothing here can move the agent-layer invariants"
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

      # Static gate, before the build: the manifesto's canonical text cannot
      # change without datePublished moving with it. Runs the probe first so a
      # guard that has stopped looking fails loudly instead of passing green.
      # Needs no dependencies (node: builtins only), so it sits ahead of npm ci
      # and fails in seconds rather than after a full build.
      - name: Manifesto date guard (probe, then check)
        if: steps.scope.outputs.relevant == 'true'
        run: |
          node scripts/verify-manifesto-date.mjs --probe
          node scripts/verify-manifesto-date.mjs

      # The i18n SEO guard proves it can still fail before it is trusted: a
      # correct in-memory site must pass and each of its sabotages must be
      # caught. Builtins only, so it runs ahead of npm ci.
      - name: i18n SEO guard selftest
        if: steps.scope.outputs.relevant == 'true'
        run: node scripts/verify-i18n-seo.mjs --selftest

      # The FAQPage schema must match the visible FAQ word for word (Google's
      # rule). It is generated from the page; this fails if someone edited one
      # side and not the other.
      - name: FAQ schema parity
        if: steps.scope.outputs.relevant == 'true'
        run: node scripts/faq-from-mdx.mjs --check

      - uses: actions/setup-node@v4
        if: steps.scope.outputs.relevant == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.scope.outputs.relevant == 'true'
      - run: npm run build
        if: steps.scope.outputs.relevant == 'true'
      # The i18n guard counts an English URL that production has and this build
      # lacks as a removal. That only holds if production's commit is in this
      # build's history: if a sibling PR merged and deployed after this run
      # checked out, production is ahead and its new pages are not removals.
      # Unknown (API error) leaves PROD_IS_ANCESTOR unset and the guard compares.
      - name: Is production an ancestor of this build?
        if: steps.scope.outputs.relevant == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PROD_SHA=$(gh api "repos/${{ github.repository }}/deployments?environment=Production&per_page=1" --jq '.[0].sha' 2>/dev/null || true)
          echo "production deploy: ${PROD_SHA:-unknown}"
          if [ -n "$PROD_SHA" ] && git cat-file -e "$PROD_SHA^{commit}" 2>/dev/null; then
            if git merge-base --is-ancestor "$PROD_SHA" HEAD; then
              echo "PROD_IS_ANCESTOR=1" >> "$GITHUB_ENV"
            else
              echo "PROD_IS_ANCESTOR=0" >> "$GITHUB_ENV"
            fi
          elif [ -n "$PROD_SHA" ]; then
            echo "PROD_IS_ANCESTOR=0" >> "$GITHUB_ENV"
          fi

      - name: Boot server, run the guard (gate) + agentic-seo (informational)
        if: steps.scope.outputs.relevant == 'true'
        run: |
          PORT=3999 npm start &
          SERVER_PID=$!
          for i in $(seq 1 60); do
            curl -sf http://localhost:3999/docs/faq >/dev/null && break
            sleep 2
          done
          # Gate: bespoke agent-layer invariants.
          BASE=http://localhost:3999 node scripts/verify-agent-layer.mjs
          GUARD_EXIT=$?
          # Gate: every FAQ/glossary claim in the JSON-LD is visible on its
          # page, and every page's own nodes declare the page's language.
          BASE=http://localhost:3999 node scripts/verify-schema-parity.mjs || GUARD_EXIT=1
          # Gate: no sitemap lastmod, schema date or <time> later than the build.
          BASE=http://localhost:3999 node scripts/verify-no-future-dates.mjs || GUARD_EXIT=1
          # Gate: hreflang clusters (self, x-default, reciprocity, sitemap/HTML
          # parity), canonicals, language signals, markdown negotiation, /index
          # 308s, and no English URL lost against production. Exit 3 (NOT RUN)
          # fails too: nothing checked is never a pass.
          BASE=http://localhost:3999 node scripts/verify-i18n-seo.mjs || GUARD_EXIT=1
          # Informational: agentic-seo Discovery checks (never blocks).
          echo "--- agentic-seo (informational) ---"
          npx --yes agentic-seo --url http://localhost:3999 --checks robots-txt,llms-txt || true
          kill "$SERVER_PID" 2>/dev/null || true
          exit $GUARD_EXIT
