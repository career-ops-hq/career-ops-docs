name: IndexNow ping + schema validation

# Runs after every push to main. Waits for Vercel to redeploy, validates
# the JSON-LD graph is live with the expected shape, then pings IndexNow
# (Bing + Yandex re-crawl immediately, free).

on:
  push:
    branches: [main]

permissions:
  contents: read
  deployments: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      # Wait for THIS commit's production deployment, not a fixed delay. A sleep
      # that ends before the deploy reads the previous sitemap, and the filter
      # below would then drop every page this push changed. Vercel records the
      # production deployment on GitHub when it is ready.
      - name: Wait for this commit's production deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 60); do
            id=$(gh api "repos/${{ github.repository }}/deployments?sha=${{ github.sha }}&environment=Production" --jq '.[0].id // empty')
            if [ -n "$id" ]; then
              state=$(gh api "repos/${{ github.repository }}/deployments/$id/statuses" --jq '.[0].state // empty')
              echo "deploy $id: ${state:-pending}"
              [ "$state" = "success" ] && exit 0
              [ "$state" = "failure" -o "$state" = "error" ] && { echo "deploy failed; nothing to announce"; exit 1; }
            fi
            sleep 10
          done
          echo "timed out waiting for the production deploy of ${{ github.sha }}"; exit 1

      - name: Validate JSON-LD is live with expected shape
        shell: bash
        run: |
          python3 - <<'PY'
          import json, re, sys, urllib.request

          html = urllib.request.urlopen('https://career-ops.org/').read().decode()
          matches = re.findall(
              r'<script[^>]*application/ld\+json[^>]*>([\s\S]*?)</script>',
              html,
          )
          if not matches:
              sys.exit('FAIL: no JSON-LD <script> found in HTML')

          d = json.loads(matches[0])
          graph = d.get('@graph', [])
          types = [n.get('@type') for n in graph]
          for t in ('WebSite', 'SoftwareSourceCode'):
              if t not in types:
                  sys.exit(f'FAIL: missing @type {t}')

          for n in graph:
              if n.get('@type') == 'SoftwareSourceCode':
                  creator_id = (n.get('creator') or {}).get('@id')
                  if creator_id != 'https://santifer.io/#person':
                      sys.exit(f'FAIL: SoftwareSourceCode.creator.@id = {creator_id!r}')
                  if not n.get('interactionStatistic'):
                      sys.exit('FAIL: SoftwareSourceCode.interactionStatistic missing')

          print('OK: JSON-LD live with WebSite + SoftwareSourceCode + creator @id + interactionStatistic')
          PY

      - name: Ping IndexNow from live sitemap (Bing, Yandex)
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request

          KEY = "1befaf1616dd4dc08b51ecb5ec601059"

          # Derive the URL list from the live sitemap so it can never drift
          # out of sync as pages are added/removed (the old hardcoded list
          # had decayed to pinging only 4 of the 14 mode pages).
          sitemap = urllib.request.urlopen(
              f'https://career-ops.org/sitemap.xml?deploy={os.environ["GITHUB_SHA"][:12]}',
              timeout=30,
          ).read().decode()

          # Announce only what this push changed. Resubmitting all ~118 URLs on
          # every push (five times on some afternoons) is the pattern IndexNow
          # asks publishers to avoid. Every sitemap URL now carries a real git
          # <lastmod>, so "changed in this push" is simply lastmod >= the oldest
          # commit in it, with a small margin. Any doubt falls back to all.
          import datetime as dt
          ev = json.load(open(os.environ['GITHUB_EVENT_PATH']))
          stamps = [c['timestamp'] for c in ev.get('commits') or [] if c.get('timestamp')]
          since = (min(dt.datetime.fromisoformat(t) for t in stamps)
                   - dt.timedelta(minutes=15)) if stamps else None

          urls, undated = [], 0
          for block in re.findall(r'<url>(.*?)</url>', sitemap, re.S):
              loc = re.search(r'<loc>\s*([^<\s]+)\s*</loc>', block).group(1)
              lm = re.search(r'<lastmod>\s*([^<\s]+)\s*</lastmod>', block)
              if since is None or lm is None:
                  undated += lm is None
                  urls.append(loc); continue
              if dt.datetime.fromisoformat(lm.group(1)) >= since:
                  urls.append(loc)
          print(f"changed since {since}: {len(urls)} URLs ({undated} undated, included)")

          if not urls:
              print("OK: nothing on the site changed in this push; no IndexNow ping")
              raise SystemExit(0)

          # The two LLM surfaces are intentionally not in the sitemap; submit
          # them explicitly so AI crawlers re-fetch them on every deploy.
          for extra in (
              'https://career-ops.org/llms.txt',
              'https://career-ops.org/llms-full.txt',
          ):
              if extra not in urls:
                  urls.append(extra)


          payload = json.dumps({
              "host": "career-ops.org",
              "key": KEY,
              "keyLocation": f"https://career-ops.org/{KEY}.txt",
              "urlList": urls,
          }).encode()

          req = urllib.request.Request(
              'https://api.indexnow.org/IndexNow',
              data=payload,
              headers={'Content-Type': 'application/json'},
          )
          resp = urllib.request.urlopen(req, timeout=30)
          print(f"OK: IndexNow notified with {len(urls)} URLs (HTTP {resp.status})")
          PY
